<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 640px;
    background: #171A2B;
    color: #FFF9EE;
    font-family: Georgia, "Times New Roman", serif;
    display: flex; align-items: center;
    overflow: hidden;
  }
  .sun {
    position: absolute; right: -140px; top: -140px;
    width: 560px; height: 560px; border-radius: 50%;
    background: radial-gradient(circle, #E4C65B 0%, #C9A227 55%, rgba(201,162,39,0) 72%);
    opacity: 0.85;
  }
  .waves { position: absolute; bottom: 64px; left: 0; right: 0; opacity: 0.5; }
  .copy { position: relative; padding: 0 90px; max-width: 880px; }
  .eyebrow {
    font-family: Verdana, Geneva, sans-serif;
    font-size: 22px; letter-spacing: 5px;
    color: #E4C65B; margin-bottom: 14px;
  }
  h1 { font-size: 72px; line-height: 1.08; font-weight: 700; }
  h1 .gold { color: #E4C65B; }
  .sub {
    font-family: Verdana, Geneva, sans-serif;
    font-size: 25px; line-height: 1.45; color: #F4E7C1;
    margin-top: 16px; max-width: 740px;
  }
  .row { display: flex; gap: 16px; margin-top: 20px; align-items: center; }
  .pill {
    font-family: Verdana, Geneva, sans-serif;
    font-size: 22px; border: 2px solid #C9A227; border-radius: 999px;
    padding: 8px 24px; color: #FFF9EE;
  }
  .pill.solid { background: #C9A227; color: #171A2B; font-weight: bold; border-color: #C9A227; }
</style>
</head>
<body>
  <div class="sun"></div>
  <svg class="waves" width="1280" height="120" viewBox="0 0 1280 120" preserveAspectRatio="none">
    <path d="M0 60 Q 80 30 160 60 T 320 60 T 480 60 T 640 60 T 800 60 T 960 60 T 1120 60 T 1280 60" stroke="#174A45" stroke-width="6" fill="none"/>
    <path d="M0 90 Q 80 62 160 90 T 320 90 T 480 90 T 640 90 T 800 90 T 960 90 T 1120 90 T 1280 90" stroke="#C9A227" stroke-width="4" fill="none" opacity="0.7"/>
  </svg>
  <div class="copy">
    <div class="eyebrow">IKIGAI · THE ROYAL MAP OF PURPOSE</div>
    <h1>Turn self-reflection<br>into a <span class="gold">map</span> for<br>meaningful living.</h1>
    <div class="sub">An original bilingual English–Tamil interactive experience inspired by general themes associated with Ikigai.</div>
    <div class="row">
      <span class="pill solid">English + தமிழ்</span>
      <span class="pill">No account · Private by design</span>
    </div>
  </div>
</body>
</html>
